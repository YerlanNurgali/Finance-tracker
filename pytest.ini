[pytest]
# By default only tests/ is collected: root scripts such as migrate_to_v2.py connect to the database
# when imported. This does not stop a file passed explicitly (`pytest migrate_to_v2.py`); see README.
testpaths = tests
python_files = test_*.py
markers =
    no_db: тест не должен подключаться к базе данных
    postgres: тест использует локальную PostgreSQL-песочницу (FT_TEST_POSTGRES_URL, см. tests/db_safety.py)
    expect_blocked: только в tests/test_safety_net.py — тест вызывает запрещённое подключение внутри db_safety.expected_refusals(n)
