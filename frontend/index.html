<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finance Tracker</title>

    <link rel="stylesheet" href="/static/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#111827">
</head>

<body>

    <div class="container">

        <header class="header">
            <div class="header-main">
                <div>
                    <h1 data-i18n="appName">Finance Tracker</h1>
                    <p data-i18n="appDescription">Управляй своими финансами</p>
                </div>
                <div class="language-switcher" data-i18n-aria-label="languageSelector" aria-label="Выбор языка">
                    <button type="button" class="language-button" data-language="kk">KZ</button>
                    <span aria-hidden="true">|</span>
                    <button type="button" class="language-button" data-language="en">EN</button>
                    <span aria-hidden="true">|</span>
                    <button type="button" class="language-button" data-language="ru">RU</button>
                </div>
            </div>
        </header>

        <section class="balance-card">
            <p class="balance-label" data-i18n="currentBalance">Текущий баланс</p>
            <h2 id="balance">0 ₸</h2>
        </section>

        <section class="summary">

            <div class="summary-card income">
                <p data-i18n="income">Доходы</p>
                <h3 id="total-income">0 ₸</h3>
            </div>

            <div class="summary-card expense">
                <p data-i18n="expense">Расходы</p>
                <h3 id="total-expense">0 ₸</h3>
            </div>

        </section>

        <section class="period-summary">

            <div class="section-header">
                <h2 data-i18n="periodSummary">Сводка за период</h2>
            </div>
        
            <div id="period-summary-content">
                <p data-i18n="loading">Загрузка...</p>
            </div>
        
        </section>

        <section class="categories-section">

            <div class="section-header">
                <h2 data-i18n="expensesByCategory">Расходы по категориям</h2>
            </div>
        
            <div id="categories-list">
                <p class="empty-message">
                    <span data-i18n="loadingCategories">Загрузка категорий...</span>
                </p>
            </div>

            <div class="chart-container">
                <canvas id="expenses-chart" width="600" height="220" data-i18n-aria-label="expensesChart" aria-label=""></canvas>
            </div>
        
        </section>

        <section class="operations-section">

            <div class="section-header">
                <h2 data-i18n="operationHistory">История операций</h2>

                <button id="add-operation-btn">
                    <span data-i18n="add">+ Добавить</span>
                </button>
            </div>

            <div class="operation-filters">
                <button class="filter-btn active" data-period="all">
                    <span data-i18n="allTime">Все</span>
                </button>
            
                <button class="filter-btn" data-period="today">
                    <span data-i18n="today">Сегодня</span>
                </button>
            
                <button class="filter-btn" data-period="week">
                    <span data-i18n="week">Неделя</span>
                </button>
            
                <button class="filter-btn" data-period="month">
                    <span data-i18n="month">Месяц</span>
                </button>

                <button id="export-csv-btn">
                    <span data-i18n="exportCsv">Экспорт CSV</span>
                </button>
            </div>
            
            <div id="operation-form" class="operation-form hidden">

    <h3 id="operation-form-title" data-i18n="newOperation">Новая операция</h3>

    <label for="operation-type">
        <span data-i18n="operationType">Тип операции</span>
    </label>

    <select id="operation-type">
        <option value="Доход">Доход</option>
        <option value="Расход">Расход</option>
    </select>


    <label for="operation-amount">
        <span data-i18n="amount">Сумма</span>
    </label>

    <input
        type="number"
        id="operation-amount"
        placeholder="Введите сумму"
        data-i18n-placeholder="enterAmount"
        min="1"
        step="0.01"
    >


    <div id="category-field">

        <label for="operation-category">
            <span data-i18n="category">Категория</span>
        </label>

        <select id="operation-category">
            <option value="Еда">Еда</option>
            <option value="Транспорт">Транспорт</option>
            <option value="Дом">Дом</option>
            <option value="Развлечения">Развлечения</option>
            <option value="Здоровье">Здоровье</option>
            <option value="Другое">Другое</option>
        </select>

    </div>


    <div class="form-buttons">

        <button id="save-operation-btn">
            <span data-i18n="save">Сохранить</span>
        </button>

        <button id="cancel-operation-btn" type="button">
            <span data-i18n="cancel">Отмена</span>
        </button>

    </div>

</div>

            <div id="operations-list">
                <p class="empty-message">
                    <span data-i18n="loadingOperations">Загрузка операций...</span>
                </p>
            </div>

        </section>

    </div>

    <script src="/static/i18n.js"></script>
    <script src="/static/script.js"></script>

</body>
</html>
