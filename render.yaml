services:
  - type: web
    name: finance-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      # Signs login tokens. Set it once in the Render dashboard (a long random string); without it
      # every restart signs with a new random key and signs all users out.
      - key: SECRET_KEY
        sync: false
      # uvicorn must not take the client address from X-Forwarded-For ("*" is refused at start on Render).
      - key: FORWARDED_ALLOW_IPS
        value: "127.0.0.1"
      # Number of proxies in front of the app. Set it to 1 only after the test service confirms that the
      # proxy appends the client's address on the right of X-Forwarded-For. Left empty, every client counts
      # under the proxy's address and the login and registration limits are shared by all users.
      - key: TRUSTED_PROXY_HOPS
        sync: false
