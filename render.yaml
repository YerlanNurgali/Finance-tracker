services:
  - type: web
    name: finance-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      # Signs login tokens. Set it once in the Render dashboard (a long random string); without it
      # every restart signs with a new random key and signs all users out.
      - key: SECRET_KEY
        sync: false
      # Render's proxy is the only client of this service, so uvicorn may trust its forwarded
      # address: without this every user shares one IP and one login/registration rate limit.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
